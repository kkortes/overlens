<modal-root open="@[when]">
  <modal-panel>
    <slot></slot>
  </modal-panel>
</modal-root>

<style>
  modal-root {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: calc(var(--unit) * 4);
    overflow-x: hidden;
    overflow-y: auto;
    background: oklch(from var(--background) l c h / 0.75);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transform: scale(1.02);
    transition:
      opacity 160ms ease-out,
      transform 160ms ease-out;
  }

  modal-root[open] {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  modal-panel slot {
    display: contents;
  }

  modal-panel {
    display: block;
    position: relative;
    width: fit-content;
    max-width: 100%;
    max-height: 90dvh;
    overflow-x: hidden;
    overflow-y: auto;
    text-align: left;
  }

  @media (width <= 768px) {
    modal-panel {
      width: 100%;
    }
  }
</style>
