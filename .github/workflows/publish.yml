name: Publish

# v*.*.* rather than v*: the floating v1 tag that callers of run.yml pin to is
# not a release and publishes nothing.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package/package.json').version")"

      - run: bun install --frozen-lockfile

      - run: bun run compile

      - run: npm publish --provenance --access public
        working-directory: package
