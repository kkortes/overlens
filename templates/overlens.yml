name: Overlens
on:
  deployment_status:
  pull_request:
    types: [closed]

concurrency:
  group: overlens-${{ github.event.deployment.ref || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlens:
    uses: apeegg/overlens-action/.github/workflows/overlens.yml@v4
    permissions:
      contents: write
      pull-requests: write
    # The defaults cover Vercel on hosted runners — every input is optional.
    # with:
    #   environments: Preview|Production  # regex a deployment's environment must match
    #   inspector: https://overlens.korte.kim
    #   runner: ubuntu-latest
